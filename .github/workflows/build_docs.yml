on:
  pull_request:
    paths:
      - .github/workflows/build_docs.yml
      - docs/**
      - kit/**
      - docs.config.ts
      - vite.config.ts
      - tsconfig.json
      - package.json
      - package-lock.json
  push:
    paths:
      - .github/workflows/build_docs.yml
      - docs/**
      - kit/**
      - docs.config.ts
      - vite.config.ts
      - tsconfig.json
      - package.json
      - package-lock.json
    branches:
      - '**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history for the "Last updated" dates

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: |
          npm ci

      - run: |
          npm run typecheck

      - run: |
          npm run build

      - run: |
          npm run linkcheck

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist/

  deploy:
    if: github.ref == 'refs/heads/develop' && github.event_name == 'push'
    needs:
      - build
    permissions:
      id-token: write
      pages: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/deploy-pages@v5

format = 4
id = "github.com/LiteLDev/LegacyScriptEngine"
version = "0.23.1"

[info]
name = "LegacyScriptEngine"
description = "A plugin engine for running LLSE plugins on LeviLamina"
tags = ["library", "plugin-engine"]

# Every variant ("", nodejs, quickjs, lua, python) has a server entry and a client entry; lip and
# LeviLauncher pick the entry by side. There are no "client*" variants.
#
# Client entries depend on the client builds by the names their releases use. All releases in range
# of LeviLamina 26.60.*, LegacyRemoteCall 0.23.*, LegacyMoney 0.23.* and iListenAttentively 0.18.*
# are tooth.json, so those deps are "#client". The engine deps of the default variant point at
# {{version}} of this package: version 0.23.1 is a tooth.json release, so they are "#client_quickjs"
# and "#client_lua". When the version is bumped for the first lip.toml release they must become
# "#quickjs" and "#lua", and the other deps the bare ids once their lip.toml releases are targeted.
# 7-zip-tooth has no client build and stays bare.

# --- Default: the QuickJS and Lua engines -------------------------------------------------------

[[variants.""]]
side = "server"
platform = "win-x64"

[variants."".deps]
"github.com/LiteLDev/LeviLamina" = "26.60.*"
"github.com/LiteLDev/LegacyScriptEngine#quickjs" = "{{version}}"
"github.com/LiteLDev/LegacyScriptEngine#lua" = "{{version}}"

[[variants.""]]
side = "client"
platform = "win-x64"

[variants."".deps]
"github.com/LiteLDev/LeviLamina#client" = "26.60.*"
"github.com/LiteLDev/LegacyScriptEngine#client_quickjs" = "{{version}}"
"github.com/LiteLDev/LegacyScriptEngine#client_lua" = "{{version}}"

[[variants.nodejs]]
side = "server"
platform = "win-x64"

[variants.nodejs.deps]
"github.com/LiteLDev/LeviLamina" = "26.60.*"
"github.com/LiteLDev/LegacyRemoteCall" = "0.23.*"
"github.com/LiteLDev/LegacyMoney" = "0.23.*"
"github.com/LiteLDev/iListenAttentively" = "0.18.*"
"github.com/LiteLDev/7-zip-tooth" = "26.*"

[[variants.nodejs.assets]]
type = "zip"
urls = ["https://{{id}}/releases/download/v{{version}}/LegacyScriptEngine-server-nodejs-windows-x64.zip"]
place = [{ src = "legacy-script-engine-nodejs/", dest = "mods/legacy-script-engine-nodejs/" }]

[[variants.nodejs.assets]]
type = "zip"
urls = ["https://github.com/LiteLDev/node/releases/download/v22.12.0/node-prebuilt.zip"]

format = 4
id = "github.com/LiteLDev/LegacyScriptEngine"
version = "0.23.1"

[info]
name = "LegacyScriptEngine"
description = "A plugin engine for running LLSE plugins on LeviLamina"
tags = ["library", "plugin-engine"]

# Every variant ("", nodejs, quickjs, lua, python) has a server entry and a client entry; lip and
# LeviLauncher pick the entry by side. There are no "client*" variants.
#
# Client entries depend on the same ids and variants as server entries: a lip.toml dependency is
# never rewritten to "#client*", and lip.toml releases have no "client*" variants. The "" variant of
# a tooth.json release is the server build, so each client range starts above the last tooth.json
# release: LeviLamina 26.60.6, LegacyRemoteCall 0.23.0, LegacyMoney 0.23.0, iListenAttentively
# 0.18.0. The engine deps of the default variant point at {{version}} of this package, so they
# resolve only once this version is a lip.toml release. 7-zip-tooth has no client build.

# --- Default: the QuickJS and Lua engines -------------------------------------------------------

[[variants.""]]
side = "server"
platform = "win-x64"

[variants."".deps]
"github.com/LiteLDev/LeviLamina" = "26.60.*"
"github.com/LiteLDev/LegacyScriptEngine#quickjs" = "{{version}}"
"github.com/LiteLDev/LegacyScriptEngine#lua" = "{{version}}"

[[variants.""]]
side = "client"
platform = "win-x64"

[variants."".deps]
"github.com/LiteLDev/LeviLamina" = ">26.60.6 <26.61.0"
"github.com/LiteLDev/LegacyScriptEngine#quickjs" = "{{version}}"
"github.com/LiteLDev/LegacyScriptEngine#lua" = "{{version}}"

[[variants.nodejs]]
side = "server"
platform = "win-x64"

[variants.nodejs.deps]
"github.com/LiteLDev/LeviLamina" = "26.60.*"
"github.com/LiteLDev/LegacyRemoteCall" = "0.23.*"
"github.com/LiteLDev/LegacyMoney" = "0.23.*"
"github.com/LiteLDev/iListenAttentively" = "0.18.*"
"github.com/LiteLDev/7-zip-tooth" = "26.*"

[[variants.nodejs.assets]]
type = "zip"
urls = ["https://{{id}}/releases/download/v{{version}}/LegacyScriptEngine-server-nodejs-windows-x64.zip"]
place = [{ src = "legacy-script-engine-nodejs/", dest = "mods/legacy-script-engine-nodejs/" }]

[[variants.nodejs.assets]]
type = "zip"
urls = ["https://github.com/LiteLDev/node/releases/download/v22.12.0/node-prebuilt.zip"]
